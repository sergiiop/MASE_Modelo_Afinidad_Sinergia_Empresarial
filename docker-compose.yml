version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mase-api
    volumes:
      - ./data:/app/data
      - ./matriz.xlsx:/app/matriz.xlsx:ro
    ports:
      - "8001:8001"
    environment:
      # Configuración general
      - ENVIRONMENT=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8001
      - DATA_DIR=/app/data
      - LOG_LEVEL=INFO
      - DEFAULT_LIMIT=100
      
      # PostgreSQL - Requeridas desde .env
      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
