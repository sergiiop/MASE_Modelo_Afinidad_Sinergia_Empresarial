version: '3.8'

services:
  # Base de datos PostgreSQL
  postgres:
    image: postgres:14-alpine
    container_name: mase-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
      - POSTGRES_DB=mase
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # Servicio para desarrollo
  mase-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: mase-dev
    volumes:
      - .:/app
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      - MASE_ENVIRONMENT=development
      - MASE_DEBUG=true
      - MASE_PORT=8000
      - MASE_HOST=0.0.0.0
      - MASE_DB_PATH=/app/data/sector_matrix.db
      - MASE_DATA_DIR=/app/data
      - MASE_LOG_LEVEL=DEBUG
      # PostgreSQL
      - MASE_POSTGRES_SERVER=postgres
      - MASE_POSTGRES_PORT=5432
      - MASE_POSTGRES_USER=postgres
      - MASE_POSTGRES_PASSWORD=postgres_password
      - MASE_POSTGRES_DB=mase
      - MASE_DEFAULT_LIMIT=100
    restart: unless-stopped

  # Servicio para producción
  mase-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: mase-prod
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8000"
    depends_on:
      - postgres
    environment:
      - MASE_ENVIRONMENT=production
      - MASE_DEBUG=false
      - MASE_PORT=8000
      - MASE_HOST=0.0.0.0
      - MASE_DB_PATH=/app/data/sector_matrix.db
      - MASE_DATA_DIR=/app/data
      - MASE_LOG_LEVEL=INFO
      - MASE_WORKERS=4
      - MASE_CORS_ORIGINS=*
      # PostgreSQL
      - MASE_POSTGRES_SERVER=postgres
      - MASE_POSTGRES_PORT=5432
      - MASE_POSTGRES_USER=postgres
      - MASE_POSTGRES_PASSWORD=postgres_password
      - MASE_POSTGRES_DB=mase
      - MASE_DEFAULT_LIMIT=50
    restart: unless-stopped

volumes:
  postgres_data:
